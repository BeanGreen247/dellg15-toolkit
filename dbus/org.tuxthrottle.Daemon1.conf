<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for tuxthrottled's optional D-Bus front end
  (tuxthrottle_dbus.py). Deliberately root-only: it mirrors the
  /run/tuxthrottle/control.sock socket, which is srw-rw---- root:root, so the
  privilege model stays identical whichever transport a client uses. The GUI
  self-elevates (pkexec) before it talks to the daemon; unprivileged callers
  are denied here exactly as they are on the socket.
-->
<busconfig>
  <policy user="root">
    <allow own="org.tuxthrottle.Daemon1"/>
    <allow send_destination="org.tuxthrottle.Daemon1"/>
    <allow receive_sender="org.tuxthrottle.Daemon1"/>
  </policy>

  <policy context="default">
    <deny own="org.tuxthrottle.Daemon1"/>
    <deny send_destination="org.tuxthrottle.Daemon1"/>
    <!-- introspection is harmless and helps `busctl introspect` for admins -->
    <allow send_destination="org.tuxthrottle.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
