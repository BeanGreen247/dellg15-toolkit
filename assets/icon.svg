<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- dark wine / Bordeaux plate -->
    <linearGradient id="plate" x1="128" y1="14" x2="128" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d2a32"/>
      <stop offset="0.55" stop-color="#571a22"/>
      <stop offset="1" stop-color="#360f15"/>
    </linearGradient>
    <radialGradient id="plateSheen" cx="90" cy="60" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flameBack" x1="128" y1="210" x2="128" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a0d0d"/>
      <stop offset="0.5" stop-color="#e5321a"/>
      <stop offset="1" stop-color="#ff7a1f"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="128" y1="205" x2="128" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.6" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="128" y1="190" x2="128" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffab26"/>
      <stop offset="1" stop-color="#fff3bf"/>
    </linearGradient>
    <linearGradient id="bezel" x1="44" y1="52" x2="212" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fe6f4"/>
      <stop offset="0.5" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#173a6b"/>
    </linearGradient>
    <radialGradient id="face" cx="128" cy="126" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17253d"/>
      <stop offset="1" stop-color="#060a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="128" cy="140" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a1f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="plateClip">
      <rect x="14" y="14" width="228" height="228" rx="52"/>
    </clipPath>
  </defs>

  <!-- rounded OS-colour plate -->
  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#plate)"/>

  <g clip-path="url(#plateClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#plateSheen)"/>

    <!-- everything below shrunk ~16% about centre so flames stay inside the plate -->
    <g transform="translate(128 130) scale(0.83) translate(-128 -128)">
      <circle cx="128" cy="140" r="130" fill="url(#glow)"/>

      <!-- flames -->
      <path fill="url(#flameBack)" d="M128 236c-58 0-96-40-96-92 0-40 22-58 30-92 5-22 0-34 6-52 10 14 12 26 14 44 8-16 10-34 8-58 16 16 26 34 28 58 3-14 4-28 2-46 14 14 24 34 26 58 4-12 6-24 6-40 12 18 18 40 18 66 0 8 6 14 12 22 8 12 12 26 12 40 0 52-44 92-112 92z"/>
      <path fill="url(#flameMid)" d="M128 224c-42 0-72-30-72-70 0-30 16-44 22-70 4-16 0-26 6-40 8 12 8 22 10 36 6-12 8-24 6-42 12 12 20 26 22 44 2-10 3-20 1-34 10 12 18 26 20 44 3-10 4-18 4-30 9 14 14 30 14 50 0 6 4 12 8 18 6 10 8 20 8 30 0 40-34 64-83 64z"/>
      <path fill="url(#flameCore)" d="M128 206c-26 0-44-20-44-46 0-20 10-30 14-48 3-12 0-18 4-28 5 8 5 16 7 26 4-9 5-18 3-30 8 9 13 20 14 32 2-8 2-14 1-24 7 9 12 20 13 34 2-7 3-12 3-20 6 10 9 20 9 34 0 26-16 46-49 46z"/>
      <path fill="url(#flameMid)" d="M196 168c14-4 26-18 24-38-1-12-10-20-8-34-14 10-16 24-16 40 0 12-4 22-14 30 4 3 8 4 14 2z"/>

      <!-- gauge -->
      <circle cx="128" cy="128" r="84" fill="url(#bezel)"/>
      <circle cx="128" cy="128" r="73" fill="url(#face)"/>
      <circle cx="128" cy="128" r="73" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>

      <g stroke-linecap="round">
        <g stroke="#5fd3ef" stroke-width="5">
          <line x1="70.6" y1="171.4" x2="61.9" y2="180.1"/>
          <line x1="62.9" y1="150.6" x2="51.4" y2="154.8"/>
          <line x1="60.5" y1="128" x2="48" y2="128"/>
          <line x1="62.9" y1="105.4" x2="51.4" y2="101.2"/>
          <line x1="70.6" y1="84.6" x2="61.9" y2="75.9"/>
          <line x1="86.3" y1="68.9" x2="79.2" y2="57.9"/>
          <line x1="107.4" y1="61.2" x2="103.2" y2="49.7"/>
        </g>
        <g stroke="#ff5a2a" stroke-width="7">
          <line x1="128" y1="60.5" x2="128" y2="46"/>
          <line x1="148.6" y1="62.9" x2="152.8" y2="49.7"/>
          <line x1="169.4" y1="70.6" x2="178.1" y2="59.9"/>
          <line x1="187.1" y1="86.3" x2="198.1" y2="77.6"/>
          <line x1="197.1" y1="105.4" x2="209.6" y2="99"/>
          <line x1="201.5" y1="128" x2="216" y2="128"/>
        </g>
      </g>

      <g transform="rotate(70 128 128)">
        <path d="M128 128 L120 48 L136 48 Z" fill="#f4f7fb"/>
        <path d="M120 48 L136 48 L128 40 Z" fill="#e02b2b"/>
        <path d="M128 128 L122 174 L134 174 Z" fill="#5b6675"/>
      </g>
      <circle cx="128" cy="128" r="14" fill="#0c3a75" stroke="#7fe0f0" stroke-width="3"/>
      <circle cx="128" cy="128" r="4.5" fill="#d6ecff"/>

      <text x="128" y="192" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="800" font-size="27" fill="#eaf4ff" letter-spacing="1.5">G15</text>
    </g>
  </g>

  <!-- inner edge highlight -->
  <rect x="14.75" y="14.75" width="226.5" height="226.5" rx="51.25" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
